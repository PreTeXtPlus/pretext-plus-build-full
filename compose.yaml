services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # persists issued TLS certs across restarts
      - caddy-config:/config
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    # Bound to loopback only: the public entrypoint is Caddy. localhost:8000
    # still works on this host (e.g. `make test`), but the API is not exposed
    # on the public interface. Caddy reaches it via the internal network.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      - redis
    # NOTE: the API deliberately has NO access to the Docker socket. Only the
    # worker can spawn build containers.

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      # Absolute host path of ./data, so the worker can translate per-job dirs
      # when bind-mounting them into sibling build containers. Set by `make up`
      # (or `export HOST_DATA_DIR=$PWD/data` before `docker compose up`).
      HOST_DATA_DIR: ${HOST_DATA_DIR}
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "builds"]
    volumes:
      - ./data:/data
      # Docker-out-of-Docker: lets the worker create sibling build containers
      # on the host daemon. DOCKER_SOCK defaults to the standard Linux path
      # (correct on a droplet); override it for Docker Desktop — see README.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      - redis
      # Its compose definition also creates the build-egress network that
      # BUILD_NETWORK names, so it must be up before any build starts.
      - egress-proxy

  # Same image, socket, and data mount as `worker`, but it drains the
  # "generate" queue (asset previews, seconds each) so a generate job never
  # waits behind a multi-minute build -- an RQ worker runs one job at a time.
  # Scale independently of builds: docker compose up -d --scale generate-worker=N
  generate-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST_DATA_DIR: ${HOST_DATA_DIR}
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "generate"]
    volumes:
      - ./data:/data
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      - redis
      - egress-proxy

  # The build containers' only way out (README "Network access"). Builds run
  # on the internal build-egress network, which has no route anywhere; this
  # proxy is on that network and on the default one, and forwards HTTP(S) only
  # to the hosts in EGRESS_ALLOW_HOSTS. Deliberately no env_file: it needs none
  # of the API's secrets. Its port is not published on the host.
  egress-proxy:
    build: ./egress-proxy
    restart: unless-stopped
    environment:
      EGRESS_ALLOW_HOSTS: ${EGRESS_ALLOW_HOSTS:-webwork-ptx.aimath.org}
    networks:
      - default
      - build-egress

networks:
  # Fixed name (no compose project prefix) so BUILD_NETWORK can name it.
  # internal: containers on it reach each other (i.e. the proxy) and nothing
  # else -- not the internet, not the cloud metadata endpoint.
  # inhibit_ipv4: by default the host also gets an address on the bridge, and
  # anything listening on all host interfaces (Caddy, sshd) would be
  # reachable at it, behind the cloud firewall's back. Without it, the
  # bridge carries container-to-container traffic only.
  build-egress:
    name: pretext-build-egress
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  redis-data:
  caddy-data:
  caddy-config:
