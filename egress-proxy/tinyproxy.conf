# Allowlisting forward proxy for build containers. The allowlist itself is
# generated at start-up from EGRESS_ALLOW_HOSTS (see entrypoint.sh).

Port 8888
# Long enough for a slow render_rpc response, short enough not to pile up.
Timeout 300
MaxClients 64

# No Allow/Deny lines: any client may connect. Only containers on the compose
# default network and the internal build network can reach this port; it is
# not published on the host.

# Whitelist mode: a request is refused unless its host matches a line of the
# filter file. Matching is on the host name only (FilterURLs is off by
# default), as a case-insensitive POSIX basic regex anchored per line.
Filter "/tmp/egress-filter"
FilterDefaultDeny Yes

# HTTPS goes through CONNECT; only to port 443.
ConnectPort 443

# Don't advertise the proxy to the upstream server.
DisableViaHeader Yes

# No LogFile and no Syslog: tinyproxy logs to stdout, i.e. `docker compose logs`.
# Info shows each request and each refusal ("Proxying refused on filtered domain").
LogLevel Info
